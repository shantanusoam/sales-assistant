<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1420">
  <title>Set your password | Sales Copilot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/reset.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Sales Copilot home">
        <span class="brand-logo" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Sales<span class="brand-light">Copilot</span></span>
      </a>
    </header>
    <div class="auth-shell">
      <section class="auth-pitch">
        <h1 class="h-xl">Almost there.</h1>
        <p id="pitch-copy">Secure links, single use. Your password never travels through anyone else's hands.</p>
      </section>
      <section class="auth-form-side" aria-label="Password form">
        <div class="auth-card">
          <div class="eyebrow-free-head">
            <h2 class="h-lg" id="form-title">Set a new password</h2>
            <p id="form-sub">Choose something strong — at least 8 characters.</p>
          </div>
          <form id="email-form" hidden>
            <div class="field">
              <label for="email">Work email</label>
              <input id="email" type="email" autocomplete="email" required>
            </div>
            <button class="button primary" type="submit" id="email-btn">Send reset link</button>
          </form>
          <form id="password-form" hidden>
            <div class="field">
              <label for="password">New password</label>
              <div class="field-with-action">
                <input id="password" type="password" minlength="8" autocomplete="new-password" required>
                <button type="button" class="field-action" id="toggle-password" aria-label="Show password" tabindex="-1">
                  <svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>
            <div class="field">
              <label for="password2">Confirm new password</label>
              <input id="password2" type="password" minlength="8" autocomplete="new-password" required>
            </div>
            <button class="button primary" type="submit" id="submit-btn">Save & log in</button>
          </form>
          <div id="notice" class="notice" role="status" aria-live="polite"></div>
          <p class="small-print" id="back-link-wrap"><a href="/login">Back to log in</a></p>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
