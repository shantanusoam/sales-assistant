<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1420">
  <title>Call history | Sales Copilot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SalesCopilot">
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/history.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Sales Copilot home">
        <span class="brand-logo" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Sales<span class="brand-light">Copilot</span></span>
      </a>
      <nav class="topbar-nav" aria-label="Primary">
        <a href="/">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>
          Live call
        </a>
        <a href="/history" class="active">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          Call history
        </a>
        <a href="/settings">
          <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
          Settings
        </a>
      </nav>
      <div class="topbar-right">
        <span class="org-chip" id="org-chip"></span>
        <button class="button ghost" id="logout-btn" aria-label="Log out">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span class="btn-label">Log out</span>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="page-heading">
        <div>
          <h1 class="h-xl">Call history</h1>
          <p>Every live session and phone call your team has run, with transcripts, coaching scores, and outcomes.</p>
        </div>
      </div>

      <section class="panel history-overview" id="history-overview" aria-label="Team coaching overview" hidden></section>

      <section class="panel" aria-label="Call history" style="min-height: 420px;">
        <div class="history-toolbar" id="history-toolbar">
          <input id="history-search" type="search" placeholder="Search transcripts, summaries, or phone numbers…" aria-label="Search calls">
          <select id="filter-disposition" aria-label="Filter by outcome">
            <option value="">All outcomes</option>
            <option value="interested">Interested</option>
            <option value="follow_up">Follow-up</option>
            <option value="no_decision">No decision</option>
            <option value="not_interested">Not interested</option>
            <option value="do_not_contact">Do not contact</option>
          </select>
          <select id="filter-channel" aria-label="Filter by channel">
            <option value="">All channels</option>
            <option value="browser">Live mic session</option>
            <option value="twilio">Phone call</option>
            <option value="mobile">Mobile field call</option>
          </select>
        </div>
        <div id="content" style="padding: 24px;"></div>
      </section>

      <footer class="footer"><span>SALES COPILOT / DEVELOPMENT MVP</span><span>Showing your organization's most recent 100 calls.</span></footer>
    </main>
  </div>
</body>
</html>
