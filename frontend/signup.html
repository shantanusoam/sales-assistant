<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1829">
  <title>Create your organization | Sales Copilot</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/signup.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Sales Copilot home">
        <span class="brand-logo" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>Sales<span class="brand-light">Copilot</span></span>
      </a>
    </header>
    <main class="main auth-shell">
      <section class="panel auth-card" aria-label="Create your organization">
        <div class="panel-head"><div class="title-group"><span class="section-mark mark-teal"></span>
          <div><h2>Create your organization</h2><p>You'll become the first admin</p></div></div>
        </div>
        <form id="signup-form">
          <label for="organization-name">Organization name</label>
          <input id="organization-name" type="text" autocomplete="organization" required>
          <label for="name" style="margin-top:12px;display:block;">Your name</label>
          <input id="name" type="text" autocomplete="name" required>
          <label for="email" style="margin-top:12px;display:block;">Work email</label>
          <input id="email" type="email" autocomplete="email" required>
          <label for="password" style="margin-top:12px;display:block;">Password</label>
          <input id="password" type="password" minlength="8" autocomplete="new-password" required>
          <span class="field-hint">At least 8 characters.</span>
          <button class="button primary" type="submit" style="margin-top:16px;width:100%;">Create organization</button>
        </form>
        <div id="notice" class="notice" role="status" aria-live="polite"></div>
        <p class="small-print">Already have an account? <a href="/login">Log in</a>.</p>
      </section>
    </main>
  </div>
</body>
</html>
