name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        env:
          SESSION_SIGNING_KEY: tAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          MASTER_ENCRYPTION_KEY: tBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          TWILIO_ACCOUNT_SID: ""
          TWILIO_AUTH_TOKEN: TESTTWILIOAUTHTOKEN
          DEEPGRAM_API_KEY: ""
          OPENAI_API_KEY: ""
          SARVAM_API_KEY: ""
        run: python -m pytest -q

      - name: Syntax-check frontend JS
        run: for f in frontend/*.js mobile/src/*.js; do node --check "$f"; done
